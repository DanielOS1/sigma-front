<div class="container mx-auto p-6">
    <h1 class="text-3xl font-bold mb-6">Gestión de Usuarios</h1>
    
    <!-- Barra de búsqueda -->
    <div class="search-container mb-4">
        <mat-form-field appearance="outline" class="w-full max-w-sm">
            <mat-icon matPrefix>search</mat-icon>
            <input matInput placeholder="Buscar por RUT..." [(ngModel)]="searchTerm">
        </mat-form-field>
    </div>

    <!-- Tabla de usuarios -->
    <mat-card class="users-table-card">
        <table mat-table [dataSource]="users" class="w-full">
            <!-- Nombre Column -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef>Nombre</th>
                <td mat-cell *matCellDef="let user">{{user.name}}</td>
            </ng-container>

            <!-- Apellido Column -->
            <ng-container matColumnDef="lastName">
                <th mat-header-cell *matHeaderCellDef>Apellido</th>
                <td mat-cell *matCellDef="let user">{{user.lastName}}</td>
            </ng-container>

            <!-- RUT Column -->
            <ng-container matColumnDef="rut">
                <th mat-header-cell *matHeaderCellDef>RUT</th>
                <td mat-cell *matCellDef="let user">{{user.rut}}</td>
            </ng-container>

            <!-- Email Column -->
            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef>Email</th>
                <td mat-cell *matCellDef="let user">{{user.email}}</td>
            </ng-container>

            <!-- Role Column -->
            <ng-container matColumnDef="role">
                <th mat-header-cell *matHeaderCellDef>Rol</th>
                <td mat-cell *matCellDef="let user">{{getRoleName(user.role)}}</td>
            </ng-container>

            <!-- Status Column -->
            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef>Estado</th>
                <td mat-cell *matCellDef="let user">
                    <div class="status-indicator">
                        <mat-icon [class.active-icon]="user.isActive" 
                                 [class.inactive-icon]="!user.isActive">
                            {{user.isActive ? 'check_circle' : 'cancel'}}
                        </mat-icon>
                        <span [class.text-green-600]="user.isActive" 
                              [class.text-red-600]="!user.isActive">
                            {{user.isActive ? 'Activo' : 'Inactivo'}}
                        </span>
                    </div>
                </td>
            </ng-container>

            <!-- Actions Column -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Acciones</th>
                <td mat-cell *matCellDef="let user">
                    <button mat-icon-button [matMenuTriggerFor]="menu">
                        <mat-icon>more_vert</mat-icon>
                    </button> 
                    <mat-menu #menu="matMenu">
                        <button mat-menu-item (click)="toggleDisableUser(user.rut, user.isActive)" [disabled]="loadingStates[user.rut]">
                            <mat-icon *ngIf="!loadingStates[user.rut]">
                                {{ user.isActive ? 'block' : 'check_circle' }}
                            </mat-icon>
                            <mat-spinner diameter="20" *ngIf="loadingStates[user.rut]"></mat-spinner>
                            <span>{{ user.isActive ? 'Desactivar' : 'Activar' }}</span>
                        </button>
                        <button mat-menu-item (click)="toggleDeleteUser(user.rut, user.isDeleted)" [disabled]="loadingStates[user.rut]">
                            <mat-icon *ngIf="!loadingStates[user.rut]">
                                {{ user.isDeleted ? 'restore' : 'delete' }}
                            </mat-icon>
                            <mat-spinner diameter="20" *ngIf="loadingStates[user.rut]"></mat-spinner>
                            <span>{{ user.isDeleted ? 'Restaurar' : 'Eliminar' }}</span>
                        </button>
                    </mat-menu>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <!-- Paginación -->
        <div class="pagination-controls">
            <button mat-button 
                    [disabled]="currentPage === 1"
                    (click)="previousPage()">
                <mat-icon>chevron_left</mat-icon>
                Anterior
            </button>
            <span class="page-indicator">Página {{currentPage}}</span>
            <button mat-button 
                    [disabled]="!hasMorePages"
                    (click)="nextPage()">
                Siguiente
                <mat-icon>chevron_right</mat-icon>
            </button>
        </div>
    </mat-card>
</div>
