<div class="user-list-container">
    <ng-container *ngIf="users.length > 0; else noUsers">
        <div *ngFor="let user of users">
            <mat-card class="user-card">
                <mat-card-content>
                    <div class="user-info">
                        <h3 class="text-dark">{{user.name}} {{user.lastName}}</h3>
                        <p class="text-primary">{{user.email}}</p>
                        <p class="text-primary">RUT: {{user.rut}}</p>
                        <p class="text-primary">Role: {{getRoleName(user.role)}}</p>
                        <ng-container *ngIf="isOwnerUser(user)">
                            <p class="text-primary">Aquaculture RUT: {{user.aquacultureRut}}</p>
                        </ng-container>
                    </div>
                </mat-card-content>
            </mat-card>
        </div>
    </ng-container>

    <ng-template #noUsers>
        <p class="text-primary">No hay usuarios para mostrar</p>
    </ng-template>

    <div class="pagination-controls">
        <button mat-button 
                class="text-primary"
                [disabled]="currentPage === 1"
                (click)="previousPage()">
            <mat-icon>chevron_left</mat-icon>
            Anterior
        </button>
        <span class="page-indicator text-primary">Página {{currentPage}}</span>
        <button mat-button 
                class="text-primary"
                [disabled]="!hasMorePages"
                (click)="nextPage()">
            Siguiente
            <mat-icon>chevron_right</mat-icon>
        </button>
    </div>
</div>
