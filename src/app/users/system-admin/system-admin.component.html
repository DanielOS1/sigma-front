<div class="admin-container">
    <h1>System Admin</h1>
    
    <mat-card class="user-form-card">
        <mat-card-header>
            <mat-card-title>Crear Nuevo Usuario</mat-card-title>
        </mat-card-header>
        
        <mat-card-content>
            <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="user-form">
                <div class="form-row">
                    <mat-form-field appearance="outline">
                        <mat-label>Nombre</mat-label>
                        <input matInput formControlName="name" required>
                        <mat-error *ngIf="userForm.get('name')?.hasError('required')">
                            El nombre es requerido
                        </mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Apellido</mat-label>
                        <input matInput formControlName="lastName" required>
                        <mat-error *ngIf="userForm.get('lastName')?.hasError('required')">
                            El apellido es requerido
                        </mat-error>
                    </mat-form-field>
                </div>

                <div class="form-row">
                    <mat-form-field appearance="outline">
                        <mat-label>Correo Electrónico</mat-label>
                        <input matInput formControlName="email" type="email" required>
                        <mat-error *ngIf="userForm.get('email')?.hasError('required')">
                            El correo electrónico es requerido
                        </mat-error>
                        <mat-error *ngIf="userForm.get('email')?.hasError('email')">
                            Ingrese un correo electrónico válido
                        </mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Rut</mat-label>
                        <input matInput formControlName="rut" required>
                        <mat-error *ngIf="userForm.get('rut')?.hasError('required')">
                            El RUT es requerido
                        </mat-error>
                    </mat-form-field>
                </div>

                <mat-form-field appearance="outline">
                    <mat-label>Rol</mat-label>
                    <mat-select formControlName="role" required>
                        <mat-option *ngFor="let role of roleOptions" [value]="role.value">
                            {{ role.label }}
                        </mat-option>
                    </mat-select>
                    <mat-error *ngIf="userForm.get('role')?.hasError('required')">
                        El rol es requerido
                    </mat-error>
                </mat-form-field>

                <div class="button-container">
                    <button mat-raised-button color="primary" type="submit" [disabled]="!userForm.valid">
                        Crear Usuario
                    </button>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</div>
