<div>
    <h1>System Admin</h1>
    
    <button mat-raised-button color="primary">Botón Primary</button>
    <button mat-raised-button color="accent">Botón Accent</button>
    
    <mat-card class="user-form-card">
        <mat-card-header>
            <mat-card-title>Crear Nuevo Usuario</mat-card-title>
        </mat-card-header>
        
        <mat-card-content>
            <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Nombre</mat-label>
                    <input matInput formControlName="name" required>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Correo Electrónico</mat-label>
                    <input matInput formControlName="email" type="email" required>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Contraseña</mat-label>
                    <input matInput formControlName="password" type="password" required>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Rol</mat-label>
                    <mat-select formControlName="role" required>
                        <mat-option value="admin">Administrador</mat-option>
                        <mat-option value="user">Usuario</mat-option>
                    </mat-select>
                </mat-form-field>

                <button mat-raised-button color="primary" type="submit" [disabled]="!userForm.valid">
                    Crear Usuario
                </button>
            </form>
        </mat-card-content>
    </mat-card>
</div>
