<div class="reset-requests-container">
    <h2>Solicitudes de cambio de contraseña</h2>
    
    <div *ngIf="resetRequests.length > 0; else noRequests">
        <mat-card *ngFor="let request of resetRequests" class="request-card">
            <mat-card-content>
                <div class="request-info">
                    <p><strong>RUT Usuario:</strong> {{request.user_rut}}</p>
                    <p><strong>Estado:</strong> <span [class]="'status-' + request.status.toLowerCase()">{{request.status}}</span></p>
                    <p><strong>Fecha de solicitud:</strong> {{formatDate(request.createdAt)}}</p>
                    
                    <div class="action-buttons" *ngIf="request.status === 'PENDING'">
                        <button mat-button color="primary" (click)="approveRequest(request.id)">
                            Resetear Contraseña
                        </button>
                    </div>
                </div>
            </mat-card-content>
        </mat-card>
    </div>

    <ng-template #noRequests>
        <p>No hay solicitudes</p>
    </ng-template>
</div>
