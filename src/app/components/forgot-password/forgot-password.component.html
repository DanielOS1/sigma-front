<div class="modal-container">
  <div class="modal-header">
    <mat-icon class="text-primary">lock_reset</mat-icon>
    <h2 mat-dialog-title>Recuperar Contraseña</h2>
  </div>

  <mat-dialog-content>
    <div class="content-wrapper">
      <p class="description">
        Ingrese su RUT para recuperar su contraseña. 
        Recibirá instrucciones en su correo electrónico registrado.
      </p>
      
      <div class="input-container">
        <mat-form-field appearance="outline">
          <mat-label>RUT</mat-label>
          <input 
            matInput 
            [(ngModel)]="rut" 
            placeholder="12.345.678-9"
            autocomplete="off">
          <mat-icon matSuffix>badge</mat-icon>
          <mat-hint>Ingrese su RUT sin puntos ni guión</mat-hint>
        </mat-form-field>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancelar</button>
    <button 
      mat-raised-button 
      color="primary" 
      (click)="onRecover()"
      [disabled]="!rut.trim()">
      Recuperar
    </button>
  </mat-dialog-actions>
</div>
