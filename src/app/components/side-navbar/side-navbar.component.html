<mat-sidenav-container class="sidenav-container">
    <mat-sidenav
      mode="side"
      opened
      class="sidenav"
      [class.collapsed]="!isExpanded"
    >
      <!-- Botón para alternar el sidebar -->
      <button mat-icon-button class="toggle-button" (click)="toggleSidebar()">
        <mat-icon>{{ isExpanded ? 'chevron_left' : 'chevron_right' }}</mat-icon>
      </button>
  
      <!-- Usuario -->
      <div class="user-info" *ngIf="isExpanded">
        <img src="assets/avatar.png" alt="User Avatar" class="user-avatar" />
        <div class="user-details">
          <h3 class="user-name">{{user.name}} {{user.lastName}}</h3>
          <p class="user-email">{{user.email}}</p>
        </div>
      </div>
  
      <!-- Opciones del menú -->
      <div class="menu-options">
        <button mat-button class="menu-item" (click)="goToSystemAdmin()">
          <mat-icon>home</mat-icon>
          <span *ngIf="isExpanded">Home</span>
        </button>
        <button mat-button class="menu-item" (click)="goToProfile()">
          <mat-icon>group</mat-icon>
          <span *ngIf="isExpanded">Profile</span>
        </button>
        <!-- Menú expandible para System Admin -->
        <ng-container *ngIf="user.role === roles.SYSTEM_ADMIN">
          <button mat-button class="menu-item" (click)="toggleUserManagement()">
            <mat-icon>supervised_user_circle</mat-icon>
            <span *ngIf="isExpanded">Resource Management</span>
            <mat-icon *ngIf="isExpanded" class="expand-icon">
              {{isUserManagementExpanded ? 'expand_less' : 'expand_more'}}
            </mat-icon>
          </button>
          <!-- Submenú de User Management -->
          <div class="submenu" *ngIf="isUserManagementExpanded && isExpanded">
            <button mat-button class="submenu-item text-primary" (click)="goToCreateUser()">
              <mat-icon>person_add</mat-icon>
              <span>Crear Usuario</span>
            </button>
            <button mat-button class="submenu-item" (click)="goToResetPassword()">
              <mat-icon>list</mat-icon>
              <span>Solicitudes de Contraseña</span>
            </button>
            <button mat-button class="submenu-item" (click)="goToAquacultureManage()">
              <mat-icon>admin_panel_settings</mat-icon>
              <span>Adminstrar Aquicolas</span>
            </button>
          </div>
        </ng-container>
  
        <div class="menu-section-title" *ngIf="isExpanded">Configure</div>
        <button mat-button class="menu-item">
          <mat-icon>lock</mat-icon>
          <span *ngIf="isExpanded">Authentication</span>
        </button>
        <button mat-button class="menu-item">
          <mat-icon>timer</mat-icon>
          <span *ngIf="isExpanded">Sessions</span>
        </button>
        <button mat-button class="menu-item">
          <mat-icon>settings</mat-icon>
          <span *ngIf="isExpanded">Settings</span>
        </button>
      </div>
  
      <!-- Botón de Logout -->
      <div class="logout-section">
        <button mat-button class="logout-button" (click)="onLogout()">
          <mat-icon>logout</mat-icon>
          <span *ngIf="isExpanded">Log out</span>
        </button>
      </div>
    </mat-sidenav>
    <mat-sidenav-content>
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
