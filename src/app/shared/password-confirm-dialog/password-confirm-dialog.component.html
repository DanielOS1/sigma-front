<div class="modal-container">
  <div class="modal-header">
    <mat-icon class="text-primary">lock</mat-icon>
    <h2 mat-dialog-title>Confirmar Contraseña</h2>
  </div>

  <mat-dialog-content>
    <div class="content-wrapper">
      <p class="description">
        Por favor, ingresa tu contraseña actual para continuar con la operación
      </p>
      
      <div class="input-container">
        <mat-form-field appearance="outline">
          <mat-label>Contraseña</mat-label>
          <input 
            matInput 
            type="password" 
            [(ngModel)]="password"
            placeholder="••••••••"
            autocomplete="current-password">
          <mat-icon matSuffix>password</mat-icon>
        </mat-form-field>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancelar</button>
    <button 
      mat-raised-button 
      color="primary"
      [disabled]="!password"
      [mat-dialog-close]="password">
      Confirmar
    </button>
  </mat-dialog-actions>
</div>
