<div class="reset-password-modal">
    <h2 mat-dialog-title>
        <mat-icon>key</mat-icon>
        Cambiar Contraseña
    </h2>

    <mat-dialog-content>
        <p>¿Está seguro que desea {{isSystemAdmin ? 'cambiar' : 'solicitar un cambio de'}} contraseña?</p>
        <p class="info-text" *ngIf="!isSystemAdmin">
            Se enviará una solicitud al administrador del sistema para procesar el cambio.
        </p>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
        <button mat-button (click)="onCancel()">
            Cancelar
        </button>
        <button mat-raised-button 
                color="primary" 
                (click)="onConfirm()">
            <div class="btn-text-container">
                <mat-spinner *ngIf="isLoading" diameter="24" strokeWidth="2" color="accent"></mat-spinner>
                <mat-icon class="!ml-2">{{isSystemAdmin ? 'key' : 'send'}}</mat-icon>
                <p class="!mb-0 !ml-2">{{isSystemAdmin ? 'Cambiar' : 'Solicitar'}}</p>
            </div>
        </button>
    </mat-dialog-actions>
</div>
